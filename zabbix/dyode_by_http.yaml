zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7ceb6b5d88fb5d7da8c4307f1bf8d652
    name: Templates/Applications
  templates:
  - uuid: c27d13342c9052bba9f0de9ec0de6f50
    template: DYODE by HTTP
    name: DYODE by HTTP
    description: 'DYODE (nc-intezra/dyode_rust) 2.1.0+, through the OUTPUT box''s local API (/v1/status).

      Covers both boxes: the input box from the status it sends through the diode.

      Set {$DYODE.URL} (https://ADDRESS:8443) and {$DYODE.TOKEN} (dyode api-token add zabbix).

      The Zabbix server must trust the output box''s certificate (its CA path), or set verify_peer off on the master item.

      Generated by tools/gen_zabbix.py in nc-intezra/dyode_monitoring.'
    vendor:
      name: nc-intezra
      version: 7.0-1
    groups:
    - name: Templates/Applications
    items:
    - uuid: 4459ef3ec77c5b9cb66ad84539698d58
      name: 'DYODE: Get status'
      type: HTTP_AGENT
      key: dyode.status.get
      delay: '{$DYODE.INTERVAL}'
      history: '0'
      value_type: TEXT
      trends: '0'
      url: '{$DYODE.URL}/v1/status'
      timeout: 10s
      headers:
      - name: Authorization
        value: Bearer {$DYODE.TOKEN}
      verify_peer: 'YES'
      verify_host: 'YES'
      description: '/v1/status of the DYODE output box: both boxes (the input box as last received through the diode) and warnings.'
      tags:
      - tag: component
        value: raw
      triggers:
      - uuid: f4bd8772b80e5c3594bd77a6f6a4e95f
        expression: nodata(/DYODE by HTTP/dyode.status.get,{$DYODE.NODATA})=1
        name: 'DYODE: output box API not answering'
        priority: HIGH
        description: 'No /v1/status for {$DYODE.NODATA}: DYODE stopped, the box is down, or the token or certificate changed.'
        tags:
        - tag: scope
          value: availability
    - uuid: dbbd06bed43d5ef387d00e4782c40b8f
      name: 'DYODE: Input box status age'
      type: DEPENDENT
      key: dyode.in.status_age
      delay: '0'
      value_type: FLOAT
      description: Seconds since the input box's status arrived through the diode; -1 when none has arrived yet.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.in.status_age_s
        error_handler: CUSTOM_VALUE
        error_handler_params: '-1'
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      units: s
      triggers:
      - uuid: 8fc0998f5f6d583390cd3fa08862e14d
        expression: last(/DYODE by HTTP/dyode.in.status_age)>{$DYODE.IN.SILENT} or last(/DYODE by HTTP/dyode.in.status_age)<0
        name: 'DYODE: no status from the input box'
        priority: HIGH
        description: 'The input box, its diode NIC, the diode or the output box''s receiver has failed: nothing is crossing.'
        tags:
        - tag: scope
          value: availability
    - uuid: 221d5dab285d5c84aaf1bce7454a0b4d
      name: 'DYODE: Warnings'
      type: DEPENDENT
      key: dyode.warnings
      delay: '0'
      value_type: TEXT
      description: Warnings from the output box, e.g. a silent input box or differing configurations.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.warnings
      - type: JAVASCRIPT
        parameters:
        - 'var w = JSON.parse(value); return w.length ? w.join(''\n'') : '''';'
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      trends: '0'
    - uuid: d61be493bbbf5205afe148ba0d0ffa27
      name: 'DYODE: Output box transport hash'
      type: DEPENDENT
      key: dyode.out.hash
      delay: '0'
      value_type: CHAR
      description: ''
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.out.transport_hash
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      trends: '0'
    - uuid: 9e9289127e9d55659f17a82500c9c4e9
      name: 'DYODE: Input box transport hash'
      type: DEPENDENT
      key: dyode.in.hash
      delay: '0'
      value_type: CHAR
      description: ''
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.in.transport_hash
        error_handler: CUSTOM_VALUE
        error_handler_params: unknown
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      trends: '0'
      triggers:
      - uuid: ff370714f6565cd78f72bb7d2c9b9ae2
        expression: last(/DYODE by HTTP/dyode.in.hash)<>last(/DYODE by HTTP/dyode.out.hash) and last(/DYODE by HTTP/dyode.in.hash)<>"unknown"
        name: 'DYODE: the boxes run different configurations'
        priority: HIGH
        description: Copy the same config.yaml to both boxes.
        tags:
        - tag: scope
          value: availability
    - uuid: 50cf74a2ef4c5291a4be5f1dd7e54eab
      name: 'DYODE: Output box version'
      type: DEPENDENT
      key: dyode.out.version
      delay: '0'
      value_type: CHAR
      description: ''
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.out.version
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      trends: '0'
    - uuid: da5f477ca8b45cde8d5051e5a3e014c6
      name: 'DYODE: Output box uptime'
      type: DEPENDENT
      key: dyode.out.uptime
      delay: '0'
      value_type: UNSIGNED
      description: ''
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.out.uptime_s
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      units: uptime
    - uuid: 5e5db8ed2ca351649fea51f2fda94031
      name: 'DYODE: Input box uptime'
      type: DEPENDENT
      key: dyode.in.uptime
      delay: '0'
      value_type: UNSIGNED
      description: ''
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.in.uptime_s
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      units: uptime
    - uuid: a64b190616315cf095726fa024b45ede
      name: 'DYODE: Transfers aborted by lidi'
      type: DEPENDENT
      key: dyode.out.aborted
      delay: '0'
      value_type: UNSIGNED
      description: Transfers aborted since the last poll (blocks lost in the diode).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.out.counters.lidi_transfers_aborted
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: SIMPLE_CHANGE
        parameters:
        - ''
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      triggers:
      - uuid: aafa5fe65d9a543183b298738f47c2df
        expression: sum(/DYODE by HTTP/dyode.out.aborted,15m)>0
        name: 'DYODE: lidi aborted transfers'
        priority: WARNING
        description: Lost files are named in file_missing events; re-send them from .dyode_sent on the input box.
        tags:
        - tag: scope
          value: availability
    - uuid: c609d001b2f258cdb99fa4125388e0ae
      name: 'DYODE: Input box static ARP entry'
      type: DEPENDENT
      key: dyode.in.arp
      delay: '0'
      value_type: UNSIGNED
      description: ''
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.in.static_arp_ok
        error_handler: CUSTOM_VALUE
        error_handler_params: '1'
      - type: BOOL_TO_DECIMAL
        parameters:
        - ''
      master_item:
        key: dyode.status.get
      tags:
      - tag: component
        value: dyode
      triggers:
      - uuid: eb17efaf20ae5dfeb7799dae66641372
        expression: last(/DYODE by HTTP/dyode.in.arp)=0
        name: 'DYODE: input box static ARP entry missing'
        priority: HIGH
        description: Without it the input box's kernel drops everything sent to the output box.
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: 2804aa08bfbd597c8d8db4032f23df53
      name: 'DYODE: input box modules'
      type: DEPENDENT
      key: dyode.modules.in
      delay: '0'
      master_item:
        key: dyode.status.get
      lifetime: 7d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.in.modules
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      lld_macro_paths:
      - lld_macro: '{#MODULE}'
        path: $.name
      - lld_macro: '{#TYPE}'
        path: $.type
      item_prototypes:
      - uuid: 20c6420c8fc35126ba87a1f75881dbd5
        name: 'DYODE input module {#MODULE}: state'
        type: DEPENDENT
        key: dyode.module.state[in,{#MODULE}]
        delay: '0'
        value_type: CHAR
        description: ''
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.boxes.in.modules[?(@.name=='{#MODULE}')].state.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: unknown
        master_item:
          key: dyode.status.get
        tags:
        - tag: component
          value: module
        - tag: module
          value: '{#MODULE}'
        - tag: side
          value: in
        trends: '0'
        trigger_prototypes:
        - uuid: 77973587597c598d80482bc6028e5485
          expression: last(/DYODE by HTTP/dyode.module.state[in,{#MODULE}])="restarting"
          name: DYODE input module {#MODULE} is not running
          priority: AVERAGE
          description: ''
      - uuid: 309e40b042da5821a9297474ad6d8882
        name: 'DYODE input module {#MODULE}: restarts'
        type: DEPENDENT
        key: dyode.module.restarts[in,{#MODULE}]
        delay: '0'
        value_type: UNSIGNED
        description: ''
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.boxes.in.modules[?(@.name=='{#MODULE}')].restarts.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        master_item:
          key: dyode.status.get
        tags:
        - tag: component
          value: module
        - tag: module
          value: '{#MODULE}'
        - tag: side
          value: in
        trigger_prototypes:
        - uuid: 57303ff19e4e5e99b51e24e8f6b6df6d
          expression: change(/DYODE by HTTP/dyode.module.restarts[in,{#MODULE}])>0
          name: DYODE input module {#MODULE} keeps restarting
          priority: WARNING
          description: ''
      - uuid: bc2c5e05cf7a54ddab09eb1a527776c8
        name: 'DYODE input module {#MODULE}: bytes sent per second'
        type: DEPENDENT
        key: dyode.module.bytes[in,{#MODULE}]
        delay: '0'
        value_type: FLOAT
        description: ''
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.boxes.in.modules[?(@.name=='{#MODULE}')].bytes_sent.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        master_item:
          key: dyode.status.get
        tags:
        - tag: component
          value: module
        - tag: module
          value: '{#MODULE}'
        - tag: side
          value: in
        units: Bps
    - uuid: 165583b653465814ab3d37c6aa05ae91
      name: 'DYODE: output box modules'
      type: DEPENDENT
      key: dyode.modules.out
      delay: '0'
      master_item:
        key: dyode.status.get
      lifetime: 7d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.boxes.out.modules
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      lld_macro_paths:
      - lld_macro: '{#MODULE}'
        path: $.name
      - lld_macro: '{#TYPE}'
        path: $.type
      item_prototypes:
      - uuid: 4619ef3065895880af1856528aa43d40
        name: 'DYODE output module {#MODULE}: state'
        type: DEPENDENT
        key: dyode.module.state[out,{#MODULE}]
        delay: '0'
        value_type: CHAR
        description: ''
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.boxes.out.modules[?(@.name=='{#MODULE}')].state.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: unknown
        master_item:
          key: dyode.status.get
        tags:
        - tag: component
          value: module
        - tag: module
          value: '{#MODULE}'
        - tag: side
          value: out
        trends: '0'
        trigger_prototypes:
        - uuid: e69b298a069b5da3a158db1793abbed7
          expression: last(/DYODE by HTTP/dyode.module.state[out,{#MODULE}])="restarting"
          name: DYODE output module {#MODULE} is not running
          priority: AVERAGE
          description: ''
      - uuid: 706383e1cc7c5fadb3caae8b54515e49
        name: 'DYODE output module {#MODULE}: restarts'
        type: DEPENDENT
        key: dyode.module.restarts[out,{#MODULE}]
        delay: '0'
        value_type: UNSIGNED
        description: ''
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.boxes.out.modules[?(@.name=='{#MODULE}')].restarts.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        master_item:
          key: dyode.status.get
        tags:
        - tag: component
          value: module
        - tag: module
          value: '{#MODULE}'
        - tag: side
          value: out
        trigger_prototypes:
        - uuid: fcf439199e335079b3668298c962204b
          expression: change(/DYODE by HTTP/dyode.module.restarts[out,{#MODULE}])>0
          name: DYODE output module {#MODULE} keeps restarting
          priority: WARNING
          description: ''
      - uuid: a8199b8769f859b6bc312cb950b5098d
        name: 'DYODE output module {#MODULE}: files rejected'
        type: DEPENDENT
        key: dyode.module.rejected[{#MODULE}]
        delay: '0'
        value_type: UNSIGNED
        description: ''
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.boxes.out.modules[?(@.name=='{#MODULE}')].events.file_rejected.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: SIMPLE_CHANGE
          parameters:
          - ''
        master_item:
          key: dyode.status.get
        tags:
        - tag: component
          value: module
        - tag: module
          value: '{#MODULE}'
        - tag: side
          value: out
        trigger_prototypes:
        - uuid: e7d722868bde5aac97e3479eda1bfd04
          expression: sum(/DYODE by HTTP/dyode.module.rejected[{#MODULE}],15m)>0
          name: 'DYODE output module {#MODULE}: files rejected'
          priority: WARNING
          description: Incomplete or not signed with the shared key; see transfer.jsonl.
      - uuid: b6dc917787ae53b0b1a1d254b405c77c
        name: 'DYODE output module {#MODULE}: files missing'
        type: DEPENDENT
        key: dyode.module.missing[{#MODULE}]
        delay: '0'
        value_type: UNSIGNED
        description: ''
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.boxes.out.modules[?(@.name=='{#MODULE}')].events.file_missing.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: SIMPLE_CHANGE
          parameters:
          - ''
        master_item:
          key: dyode.status.get
        tags:
        - tag: component
          value: module
        - tag: module
          value: '{#MODULE}'
        - tag: side
          value: out
        trigger_prototypes:
        - uuid: 078a917bdea6558986a95df1b416c3cd
          expression: sum(/DYODE by HTTP/dyode.module.missing[{#MODULE}],30m)>0
          name: 'DYODE output module {#MODULE}: files never arrived'
          priority: WARNING
          description: Re-send them from .dyode_sent on the input box.
      - uuid: 7af1c280c5ab50809b14728ca3e4f993
        name: 'DYODE output module {#MODULE}: bytes stored per second'
        type: DEPENDENT
        key: dyode.module.bytes[out,{#MODULE}]
        delay: '0'
        value_type: FLOAT
        description: ''
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.boxes.out.modules[?(@.name=='{#MODULE}')].bytes_stored.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        master_item:
          key: dyode.status.get
        tags:
        - tag: component
          value: module
        - tag: module
          value: '{#MODULE}'
        - tag: side
          value: out
        units: Bps
    tags:
    - tag: class
      value: software
    - tag: target
      value: dyode
    macros:
    - macro: '{$DYODE.URL}'
      value: https://192.168.50.4:8443
      description: The output box's api.out.listen, with https://
    - macro: '{$DYODE.TOKEN}'
      type: SECRET_TEXT
      description: 'A read token from: sudo dyode api-token add zabbix'
    - macro: '{$DYODE.INTERVAL}'
      value: 30s
      description: How often /v1/status is read
    - macro: '{$DYODE.NODATA}'
      value: 3m
      description: 'No answer for this long: API down'
    - macro: '{$DYODE.IN.SILENT}'
      value: '30'
      description: Seconds without input box status before alerting
